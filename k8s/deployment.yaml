apiVersion: v1
kind: Namespace
metadata:
  name: jarvis-mk42
  labels:
    name: jarvis-mk42
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jarvis-config
  namespace: jarvis-mk42
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  HEALTH_PORT: "8001"
---
apiVersion: v1
kind: Secret
metadata:
  name: jarvis-secrets
  namespace: jarvis-mk42
type: Opaque
data:
  # Base64 encoded values - replace with actual values
  POSTGRES_PASSWORD: cGFzc3dvcmQ=  # password
  GRAFANA_PASSWORD: YWRtaW4=  # admin
  SECRET_KEY: c2VjcmV0LWtleQ==  # secret-key
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jarvis-app
  namespace: jarvis-mk42
  labels:
    app: jarvis-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jarvis-app
  template:
    metadata:
      labels:
        app: jarvis-app
    spec:
      containers:
      - name: jarvis-app
        image: ghcr.io/your-username/jarvis-mk42:latest
        ports:
        - containerPort: 8000
        - containerPort: 8001
        envFrom:
        - configMapRef:
            name: jarvis-config
        env:
        - name: DATABASE_URL
          value: "postgresql://jarvis:$(POSTGRES_PASSWORD)@postgres-service:5432/jarvis_db"
        - name: REDIS_URL
          value: "redis://redis-service:6379/0"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jarvis-secrets
              key: POSTGRES_PASSWORD
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: jarvis-secrets
              key: SECRET_KEY
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 5
        volumeMounts:
        - name: app-data
          mountPath: /app/data
        - name: app-logs
          mountPath: /app/logs
      volumes:
      - name: app-data
        persistentVolumeClaim:
          claimName: jarvis-app-data
      - name: app-logs
        persistentVolumeClaim:
          claimName: jarvis-app-logs
---
apiVersion: v1
kind: Service
metadata:
  name: jarvis-app-service
  namespace: jarvis-mk42
spec:
  selector:
    app: jarvis-app
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  - name: health
    port: 8001
    targetPort: 8001
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: jarvis-mk42
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "jarvis_db"
        - name: POSTGRES_USER
          value: "jarvis"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: jarvis-secrets
              key: POSTGRES_PASSWORD
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 250m
            memory: 256Mi
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        - name: init-sql
          mountPath: /docker-entrypoint-initdb.d
          readOnly: true
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - jarvis
            - -d
            - jarvis_db
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - jarvis
            - -d
            - jarvis_db
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-data
      - name: init-sql
        configMap:
          name: postgres-init-sql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: jarvis-mk42
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: jarvis-mk42
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        args:
        - redis-server
        - --appendonly
        - "yes"
        - --maxmemory
        - 128mb
        - --maxmemory-policy
        - allkeys-lru
        resources:
          limits:
            cpu: 200m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        volumeMounts:
        - name: redis-data
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          initialDelaySeconds: 15
          periodSeconds: 5
      volumes:
      - name: redis-data
        persistentVolumeClaim:
          claimName: redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: jarvis-mk42
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
  type: ClusterIP
